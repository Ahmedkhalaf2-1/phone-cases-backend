services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phonecases
      POSTGRES_PASSWORD: phonecases_dev_password
      POSTGRES_DB: phonecases
    ports:
      # Host port 5544 (not the default 5432) to avoid clashing with a
      # native/other PostgreSQL instance that may already be running on
      # the host - see docs/DECISIONS.md.
      - '5544:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phonecases']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phonecases
      POSTGRES_PASSWORD: phonecases_test_password
      POSTGRES_DB: phonecases_test
    ports:
      - '5545:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phonecases']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
